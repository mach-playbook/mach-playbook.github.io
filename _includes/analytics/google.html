<!-- Google tag (gtag.js) - Async Non-Blocking with GPC Consent & 404 Telemetry -->
<script>
  (function() {
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;

    if (typeof navigator !== 'undefined' && navigator.globalPrivacyControl === true) {
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'granted'
      });
    }

    gtag('js', new Date());
    gtag('config', '{{ site.analytics.google.id }}');

    function loadGtag() {
      if (window._gtagLoaded) return;
      window._gtagLoaded = true;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.id }}';
      document.head.appendChild(s);
    }
    window.loadGtag = loadGtag;

    document.addEventListener('DOMContentLoaded', function() {
      if (document.title && document.title.indexOf('404') !== -1) {
        loadGtag();
        gtag('event', 'page_not_found', {
          page_location: window.location.href,
          page_referrer: document.referrer || '(direct)'
        });
      }
    });

    ['scroll', 'touchstart', 'click', 'keydown'].forEach(function(ev) {
      window.addEventListener(ev, loadGtag, { once: true, passive: true });
    });
    if ('requestIdleCallback' in window) {
      window.requestIdleCallback(function() { setTimeout(loadGtag, 7000); });
    } else {
      setTimeout(loadGtag, 7500);
    }
  })();
</script>
