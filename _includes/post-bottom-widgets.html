<!-- Bottom Widgets: Actualizado recientemente & Etiquetas populares en 2 columnas horizontales -->
<section class="post-bottom-widgets mb-4">
  <div class="row row-cols-1 row-cols-md-2 g-3">
    <!-- Columna 1: Actualizado recientemente -->
    <div class="col">
      <div class="card h-100 p-3 rounded-3 shadow-sm border bg-dark-subtle">
        <h4 class="card-title h6 fw-bold mb-3 d-flex align-items-center text-muted">
          <i class="far fa-clock fa-fw me-2 text-primary"></i>
          {{ site.data.locales[include.lang].panel.lastmod | default: "Actualizado recientemente" }}
        </h4>
        <div class="bottom-widget-content">
          {% include_cached update-list.html lang=include.lang %}
        </div>
      </div>
    </div>

    <!-- Columna 2: Etiquetas populares -->
    <div class="col">
      <div class="card h-100 p-3 rounded-3 shadow-sm border bg-dark-subtle">
        <h4 class="card-title h6 fw-bold mb-3 d-flex align-items-center text-muted">
          <i class="fas fa-tags fa-fw me-2 text-primary"></i>
          {{ site.data.locales[include.lang].panel.trending_tags | default: "Etiquetas populares" }}
        </h4>
        <div class="bottom-widget-content">
          {% include_cached trending-tags.html lang=include.lang %}
        </div>
      </div>
    </div>
  </div>
</section>
